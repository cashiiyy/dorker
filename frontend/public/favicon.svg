<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="dorkerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#060a12"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="url(#dorkerGrad)" stroke-opacity="0.4"/>
  <!-- Crosshair ring -->
  <circle cx="16" cy="16" r="8" stroke="url(#dorkerGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="3" fill="#38bdf8"/>
  <!-- Reticle markers -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="8" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="28" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
